version: '3.8'

# =============================================================================
# AIVision Local Development - Docker Compose
# =============================================================================
#
# Quick Start:
#   1. Copy .env.example to .env and fill in API keys
#   2. Run: docker-compose up -d
#   3. Access:
#      - Frontend: http://localhost:5173
#      - Backend:  http://localhost:8000
#      - API Docs: http://localhost:8000/docs
#      - DB Admin: http://localhost:5050 (pgAdmin)
#
# =============================================================================

services:
  # PostgreSQL Database (JSON storage only - NO file storage)
  postgres:
    image: postgres:14-alpine
    container_name: aivision-postgres
    environment:
      POSTGRES_DB: aivision
      POSTGRES_USER: aivision
      POSTGRES_PASSWORD: aivision_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivision"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aivision-network

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aivision-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aivision.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - aivision-network

  # Redis (optional - for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: aivision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aivision-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PYTHON_VERSION: 3.11
    container_name: aivision-backend
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: postgresql://aivision:aivision_dev_password@postgres:5432/aivision
      REDIS_URL: redis://redis:6379/0

      # Application
      ENVIRONMENT: development
      DEBUG: "True"
      LOG_LEVEL: INFO

      # Storage - JSON ONLY (NO file storage)
      STORAGE_TYPE: none
      STORE_ORIGINAL_FILES: "false"
      STORE_EXTRACTED_IMAGES: "false"

      # CORS
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

      # Models
      DEFAULT_VISION_MODEL: gemini-2.0-flash-exp
      CONFIDENCE_THRESHOLD: 0.70

      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: 60
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app:cached
      - ./tests:/app/tests:cached
      - ./alembic:/app/alembic:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python -c 'from app.db.session import init_db; init_db()' &&
        echo 'Database initialized!' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - aivision-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aivision-frontend
    environment:
      VITE_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/vite.config.ts:/app/vite.config.ts:cached
      # Exclude node_modules
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - aivision-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aivision-network:
    driver: bridge

# =============================================================================
# Useful Commands:
# =============================================================================
#
# Start all services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f
#   docker-compose logs -f backend
#   docker-compose logs -f frontend
#
# Stop all services:
#   docker-compose down
#
# Rebuild services:
#   docker-compose up -d --build
#
# Run tests:
#   docker-compose exec backend pytest tests/ -v
#
# Access backend shell:
#   docker-compose exec backend bash
#
# Access database:
#   docker-compose exec postgres psql -U aivision -d aivision
#
# Clean everything (including volumes):
#   docker-compose down -v
#
# =============================================================================
